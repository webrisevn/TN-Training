<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LIVE — Training & Assessment Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#12294d;--gold:#F2A422;--gold2:#ffc061;--ink:#eaf0ff;--muted:#9fb0d8;--green:#2ec76a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",Arial,sans-serif;background:radial-gradient(1300px 800px at 82% -12%,#12305e,#081633 68%);color:var(--ink);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1500px;margin:0 auto;padding:24px 34px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1.5px solid rgba(255,255,255,.1);padding-bottom:16px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:70px}
.brand .t small{color:var(--gold2);font-weight:700;letter-spacing:2px;font-size:14px}
.brand .t h1{font-size:30px;line-height:1.1;margin-top:3px}
.live{display:flex;gap:26px;text-align:center}
.live .b{font-size:44px;font-weight:800;line-height:1}
.live .b.g{color:var(--gold)} .live .b.gr{color:var(--green)}
.live .l{color:var(--muted);font-size:13px;letter-spacing:1px;margin-top:4px}
.livedot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);margin-right:8px;animation:blink 1.2s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;margin-top:26px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.sec-t{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:16px}
.pod{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:20px 12px;text-align:center;transition:.5s}
.pod .m{font-size:38px}.pod .nm{font-size:22px;font-weight:800;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:34px;font-weight:800;color:var(--gold2)}
.pod.p1{transform:translateY(-18px);border-color:var(--gold);box-shadow:0 0 44px rgba(242,164,34,.34)}
.pod.p1 .sc{color:var(--gold)}
.rows .r{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 18px;margin:9px 0;font-size:20px;transition:transform .45s cubic-bezier(.2,.8,.3,1),background .4s}
.rows .r .rk{width:44px;font-weight:800;color:var(--gold2);font-size:22px}
.rows .r .nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .r .sc{font-weight:800;font-size:24px;width:80px;text-align:right}
.rows .r.pop{animation:pop .7s}
@keyframes pop{0%{background:rgba(242,164,34,.4);transform:scale(1.03)}100%{background:rgba(255,255,255,.05);transform:none}}
/* lobby / playing */
.players{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.pl{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 15px;min-width:190px;flex:1 1 190px;max-width:260px;animation:join .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes join{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:none}}
.pl .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pr{height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:9px}
.pl .pr>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .5s ease}
.pl .st{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.pl.done{border-color:var(--green)}.pl.done .st{color:var(--green)}
.empty{color:var(--muted);font-size:18px;padding:40px;text-align:center}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.confetti{position:fixed;top:-12px;width:11px;height:17px;z-index:99;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg);opacity:.9}}
.qrhint{position:fixed;right:20px;bottom:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img id="logo" alt=""/><div class="t"><small>TRAINING &amp; ASSESSMENT HUB · LIVE</small><h1 id="title">—</h1></div></div>
    <div class="live">
      <div><div class="b gr" id="cPlay">0</div><div class="l"><span class="livedot"></span>ĐANG THI</div></div>
      <div><div class="b g" id="cDone">0</div><div class="l">ĐÃ NỘP</div></div>
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="sec-t">🏆 Bảng xếp hạng · realtime</div>
      <div class="podium" id="podium"></div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="lbEmpty">Chưa có ai nộp bài. Xếp hạng sẽ nhảy lên ngay khi có người hoàn thành…</div>
    </div>
    <div>
      <div class="sec-t">👋 Phòng chờ &amp; đang thi</div>
      <div class="players" id="players"></div>
      <div class="empty" id="plEmpty">Đang chờ người chơi quét QR và bắt đầu…</div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="qrhint" id="qrhint" style="display:none"></div>

/* players state (realtime, no DB) keyed by uid */
const P={}; let prevTop=null; let poppers=new Set();
function upsert(uid,patch){P[uid]=Object.assign({uid,name:'—',answered:0,total:0,score:null,done:false,ts:Date.now()},P[uid]||{},patch);}

function render(){
  const arr=Object.values(P);
  const done=arr.filter(p=>p.done).sort((a,b)=>b.score-a.score||(a.finishTs||0)-(b.finishTs||0));
  const playing=arr.filter(p=>!p.done).sort((a,b)=>(b.answered/(b.total||1))-(a.answered/(a.total||1))||a.ts-b.ts);
  document.getElementById('cPlay').textContent=playing.length;
  document.getElementById('cDone').textContent=done.length;
  // leaderboard
  document.getElementById('lbEmpty').style.display=done.length?'none':'block';
  const medal=['🥇','🥈','🥉'];const order=[1,0,2];
  document.getElementById('podium').innerHTML=done.length?order.map(i=>{const x=done[i];if(!x)return '<div class="pod" style="visibility:hidden"></div>';
    return `<div class="pod ${i===0?'p1':''}"><div class="m">${medal[i]}</div><div class="nm">${esc(x.name)}</div><div class="sc">${x.score}</div></div>`;}).join(''):'';
  const rest=done.slice(3,13);
  document.getElementById('rows').innerHTML=rest.map((x,i)=>`<div class="r ${poppers.has(x.uid)?'pop':''}"><div class="rk">#${i+4}</div><div class="nm">${esc(x.name)}</div><div class="sc">${x.score}</div></div>`).join('');
  // players/lobby
  document.getElementById('plEmpty').style.display=arr.length?'none':'block';
  document.getElementById('players').innerHTML=[...playing,...done.filter(p=>true)].slice(0,30).map(p=>{
    const pct=p.total?Math.round(p.answered/p.total*100):0;
    return `<div class="pl ${p.done?'done':''}"><div class="nm">${esc(p.name)}</div><div class="pr"><i style="width:${p.done?100:pct}%"></i></div>
      <div class="st"><span>${p.done?'Hoàn thành':(p.answered+'/'+(p.total||'?')+' câu')}</span><span>${p.done?(p.score+' điểm'):''}</span></div></div>`;
  }).join('');
  // celebrate new #1
  if(done[0]&&done[0].uid!==prevTop){if(prevTop!==null)confetti();prevTop=done[0].uid;}
}

/* Realtime channel (broadcast + presence) — KHÔNG ghi database */
const CH=sb.channel('assess:'+slug(),{config:{broadcast:{self:true},presence:{key:'board'}}});
CH.on('broadcast',{event:'join'},({payload})=>{upsert(payload.uid,{name:payload.name,total:payload.total,answered:0,done:false});render();})
  .on('broadcast',{event:'progress'},({payload})=>{if(P[payload.uid]&&P[payload.uid].done)return;upsert(payload.uid,{name:payload.name,answered:payload.answered,total:payload.total});render();})
  .on('broadcast',{event:'finish'},({payload})=>{delete P['fin:'+payload.name+':'+payload.score];poppers.add(payload.uid);upsert(payload.uid,{name:payload.name,score:payload.score,done:true,finishTs:Date.now(),answered:P[payload.uid]?P[payload.uid].total:0});render();setTimeout(()=>{poppers.delete(payload.uid);render();},900);})
  .subscribe();

/* get_board: lấy tiêu đề/brand + đồng bộ những người ĐÃ NỘP (phòng khi mở màn chiếu giữa chừng) */
async function sync(){
  const {data,error}=await sb.rpc('get_board',{p_qr:slug()});
  if(error||!data||data.error){document.getElementById('title').textContent='Không tìm thấy bài (kiểm tra slug/publish)';return;}
  const org=data.org||{};
  document.getElementById('title').textContent=data.title||'';
  document.getElementById('foot').textContent=(org.footer_text||org.name||'')+'  ·  '+slug();
  document.getElementById('qrhint').style.display='block';
  document.getElementById('qrhint').textContent='Bài: '+(data.title||'')+' · Điểm đạt '+(data.passing_score||0)+'%';
  // merge finished (authoritative) — chỉ thêm nếu chưa có qua realtime
  (data.leaderboard||[]).forEach(x=>{
    const key='fin:'+x.name+':'+x.score;
    if(!Object.values(P).some(p=>p.done&&p.name===x.name&&p.score===x.score)){
      upsert(key,{name:x.name,score:x.score,done:true,total:1,answered:1,finishTs:0});
    }
  });
  render();
}
sync(); setInterval(sync,2500); render();
</script>
